---
"$id": GS1-Company-Prefix-Schema
"$schema": https://json-schema.org/draft/2020-12/schema
version: 1.0.0
title: GS1CompanyPrefixLicenseCredential
description: A GS1 Company Prefix License is issued by a GS1 Member Organization or
  GS1 Global Office and allocated to a user company or to itself for the purpose of
  generating tier 1 GS1 identification keys
type: object
properties:
  "@context":
    type: array
    readOnly: true
    const:
    - https://www.w3.org/ns/credentials/v2
    - https://ref.gs1.org/gs1/vc/license-context
    default:
    - https://www.w3.org/ns/credentials/v2
    - https://ref.gs1.org/gs1/vc/license-context
    items:
      type: string
      enum:
      - https://www.w3.org/ns/credentials/v2
      - https://ref.gs1.org/gs1/vc/license-context
  type:
    type: array
    readOnly: true
    const:
    - VerifiableCredential
    - GS1CompanyPrefixLicenseCredential
    default:
    - VerifiableCredential
    - GS1CompanyPrefixLicenseCredential
    items:
      type: string
      enum:
      - VerifiableCredential
      - GS1CompanyPrefixLicenseCredential
  id:
    type: string
    format: uri
  credentialSchema:
    type: object
    properties:
      id:
        title: Credential Schema Identifier
        type: string
        format: uri
        const: https://id.gs1.org/vc/schema/v1/companyprefix
      type:
        title: Credential Schema Type
        const: JsonSchema
    additionalProperties: false
    required:
    - id
    - type
  credentialStatus:
    type: object
    description: Revocation supported.
    properties:
      id:
        title: Credential Status
        type: string
        format: url
        example: https://cbpvsvip-vc.dev.gs1us.org/status/2c0a1f02-d545-481b-902a-1e919cd706e2/1121973
      type:
        type: string
        const: BitstringStatusListEntry
      statusPurpose:
        type: string
        const: revocation
      statusListIndex:
        type: string
        example: '1121973'
      statusSize:
        type: number
        example: 2
      statusListCredential:
        type: string
        format: url
        example: https://cbpvsvip-vc.dev.gs1us.org/status/2c0a1f02-d545-481b-902a-1e919cd706e2/
      statusMessage:
        type: array
        readOnly: true
        items:
          type: object
          properties:
            status:
              type: string
              enum:
              - '0x0'
              - '0x1'
            message:
              type: string
              enum:
              - valid
              - revoked
    additionalProperties: false
    required:
    - id
    - type
    - statusPurpose
    - statusListIndex
    - statusListCredential
  validFrom:
    description: Date from which the credential is to be considered valid.
    type: string
    format: date-time
  issuer:
    title: Issuer
    description: The issuer of the credential
    type: object
    properties:
      id:
        title: Issuer Identifier
        type: string
        format: uri
      name:
        title: Issuer Name
        type: string
    required:
    - id
    additionalProperties: false
  credentialSubject:
    type: object
    properties:
      id:
        title: Member Company Decentralized Identifier. The subject of this credential
          must be the issuer of all GS1 Key and Data Credential inherit from the company
          prefix.
        type: string
        format: uri
      organization:
        type: object
        properties:
          gs1:partyGLN:
            title: The GLN can be used to identify a party represented in a data carrier
              on documents, locations, or other places where value could be added.
            type: string
          gs1:organizationName:
            title: The organization name associated with the  PartyGLN.
            type: string
        required:
        - gs1:partyGLN
        - gs1:organizationName
      licenseValue:
        type: string
        title: GS1 Company Prefix License Value
        pattern: "^\\d{3,12}$"
      alternativeLicenseValue:
        title: GS1 Company Prefix Alternative License Value. This field is optional.
        type: string
      extendsCredential:
        title: Provides a complete chain to the GS1 Prefix or GS1-8 Prefix license
          credential issued by GS1 Global Office.
        type: string
    required:
    - id
    - licenseValue
    - organization
    - extendsCredential
required:
- "@context"
- id
- type
- issuer
- validFrom
- credentialSchema
- credentialStatus
- credentialSubject
example:
  "@context":
  - https://www.w3.org/ns/credentials/v2
  - https://ref.gs1.org/gs1/vc/license-context
  id: http://did-vc.gs1us.org/vc/license/081015955
  type:
  - VerifiableCredential
  - GS1CompanyPrefixLicenseCredential
  issuer:
    id: did:web:cbpvsvip-vc.gs1us.org
    name: GS1 US
  name: GS1 Company Prefix License
  description: THIS GS1 DIGITAL LICENSE CREDENTIAL IS FOR TESTING PURPOSES ONLY. A
    GS1 Company Prefix License is issued by a GS1 Member Organization or GS1 Global
    Office and allocated to a user company or to itself for the purpose of generating
    tier 1 GS1 identification keys.
  validFrom: '2024-01-25T12:30:00.000Z'
  credentialSubject:
    id: did:web:healthytots.net
    organization:
      gs1:partyGLN: '0810159550000'
      gs1:organizationName: Healthy Tots
    extendsCredential: https://id.gs1.org/vc/license/gs1_prefix/08
    licenseValue: '081015955'
    alternativeLicenseValue: '81015955'
  credentialSchema:
    id: https://id.gs1.org/vc/schema/v1/companyprefix
    type: JsonSchema
  credentialStatus:
    id: https://cbpvsvip-vc.dev.gs1us.org/status/2c0a1f02-d545-481b-902a-1e919cd706e2/11920
    type: BitstringStatusListEntry
    statusPurpose: revocation
    statusListIndex: '11920'
    statusListCredential: https://cbpvsvip-vc.dev.gs1us.org/status/2c0a1f02-d545-481b-902a-1e919cd706e2/
